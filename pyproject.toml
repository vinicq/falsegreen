[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "falsegreen"
version = "0.9.2"
description = "Find unit tests that give false positives: green tests that protect nothing, and tests that pass while asserting the wrong expected value."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinicius Queiroz" }]
keywords = ["pytest", "testing", "test-smells", "false-positive", "static-analysis", "pre-commit", "code-quality", "ai-generated-tests"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/vinicq/falsegreen"
Issues = "https://github.com/vinicq/falsegreen/issues"

[project.scripts]
falsegreen = "falsegreen.scanner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/falsegreen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# examples/ holds illustrative scan targets, not runnable code: they reference
# helpers that do not exist on purpose, so linting them only reports noise.
extend-exclude = ["examples"]

[tool.ruff.lint]
# The lint surface is declared here instead of inherited from whatever ruff
# happens to default to. It used to be inherited, and ruff 0.16 widened its
# defaults: with `ruff>=0.5` unpinned, CI went from clean to 106 findings
# (UP031, BLE001, SIM102, S112, I001, RUF022 and friends) with no commit in
# between. These four sets are exactly what the repo was already being held to.
# Adopting a wider set is a deliberate change with its own PR, not something a
# dependency release decides.
select = ["E4", "E7", "E9", "F"]
