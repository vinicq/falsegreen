name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Re-verify main once a week. Checking only on push means a floating tool can
  # break main and the badge stays green until someone happens to commit. That is
  # how ruff 0.16 widening its defaults left main with 106 lint findings and no
  # signal at all: there was no push, so there was no run.
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Self-scan (must not flag itself)
        run: python -m falsegreen src tests
